version: '3.9'

services:
  nginx:
    container_name: prakticum-nginx
    image: nginx:1.27-alpine
    restart: always
    ports:
      - '80:80'
    environment:
      # origin своего API для CSP connect-src (без path), напр. http://158.160.64.116:3001
      EXTERNAL_SERVER_ORIGIN: ${EXTERNAL_SERVER_URL}
      SERVER_PORT: ${SERVER_PORT:-3001}
      # envsubst только эти переменные (не трогать $$host и т.п.)
      NGINX_ENVSUBST_FILTER: '^(EXTERNAL_SERVER_ORIGIN|SERVER_PORT)$'
    volumes:
      - ./nginx/nginx.main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      client:
        condition: service_started
      server:
        condition: service_healthy
    networks:
      - app-net

  client:
    container_name: prakticum-client
    image: prakticum-client
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        CLIENT_PORT: ${CLIENT_PORT}
    restart: always
    # Снаружи лучше ходить через nginx:80; 3000 оставляем для отладки
    ports:
      - '${CLIENT_PORT}:80'
    env_file:
      - .env
    environment:
      CLIENT_PORT: ${CLIENT_PORT}
      SERVER_PORT: ${SERVER_PORT}
      INTERNAL_SERVER_URL: http://server:${SERVER_PORT}
      EXTERNAL_SERVER_URL: ${EXTERNAL_SERVER_URL}
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC}
      CSP_FORM_ACTION: ${CSP_FORM_ACTION:-}
      # CSP отдаёт nginx — не дублируем (иначе браузер требует оба заголовка)
      CSP_FROM_NGINX: '1'
      NODE_ENV: production
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-net

  server:
    container_name: prakticum-server
    image: prakticum-server
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        SERVER_PORT: ${SERVER_PORT}
    restart: always
    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'
    env_file:
      - .env
    environment:
      SERVER_PORT: ${SERVER_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: '5432'
      POSTGRES_HOST: postgres
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:'+(process.env.SERVER_PORT||3001)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-net

  postgres:
    container_name: prakticum-postgres
    image: postgres:14
    restart: always
    ports:
      - '${POSTGRES_EXTERNAL_PORT:-5441}:5432'
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./tmp/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
