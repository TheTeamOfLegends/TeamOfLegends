name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install main deps
        run: yarn
      - name: Initialize
        run: yarn lerna bootstrap
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test

  deploy:
    name: Deploy to Yandex Cloud
    needs: eslint
    if: >
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DEPLOY_PATH
          # первая сборка всё ещё долгая; повторные с кешем быстрее
          command_timeout: 60m
          script: |
            set -euo pipefail

            APP_DIR="${DEPLOY_PATH:-$HOME/TeamOfLegends}"
            cd "$APP_DIR"

            echo "Deploying $(git rev-parse --short HEAD) → $(pwd)"

            git fetch origin dev
            git checkout dev
            git pull --ff-only origin dev

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # параллельная сборка client+server, up без лишнего rebuild
            docker compose build --parallel
            docker compose up -d

            docker compose ps
            docker images --format '{{.Repository}}:{{.Tag}} {{.CreatedSince}}' | head -8
